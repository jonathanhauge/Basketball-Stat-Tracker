:root{
  --bg:#f3f4f4; --panel:#fff; --ink:#091f40; --text:#3d4041; --muted:#6b6f70; --line:#c9cccc; --hair:#e4e6e6;
  --navy:#091f40; --on-navy-muted:#c9cccc; --off:#1593b3; --def:#d63b35; --warn:#e07b00; --chip:#f6f7f7;
  --display:"CP Broncos","VTF Redzone Classic",Impact,sans-serif;
  --label:"VTF Redzone Classic","CP Broncos",Impact,sans-serif;
  --body:Gotham,"Open Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--body);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.top .brand{font-family:var(--label);font-size:15px;letter-spacing:.1em}
.status{display:flex;align-items:center;gap:6px;color:var(--on-navy-muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live i{background:#3fd07a;animation:pulse 2s infinite}
.status.final i{background:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.live i{animation:none}}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:6px 16px}
.team{min-width:0}
.team.r{text-align:right}
.tname{font-family:var(--label);font-size:clamp(16px,4.6vw,26px);letter-spacing:.04em;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.team.us .tname{border-left:4px solid var(--off);padding-left:8px}
.team.r .tname{border-right:4px solid var(--def);padding-right:8px}
.score{font-family:var(--display);font-size:clamp(54px,17vw,96px);line-height:.9;margin-top:4px}
.meta{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--on-navy-muted);margin-top:6px}
.bonus{display:inline-block;background:var(--warn);color:#fff;border-radius:3px;padding:0 5px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pips{display:flex;gap:3px;margin-top:5px;align-items:center;font-size:10px;letter-spacing:.08em;color:var(--on-navy-muted)}
.team.r .pips{justify-content:flex-end}
.pips b{display:inline-block;width:12px;height:6px;border-radius:2px;background:#fff}
.pips b.u{background:transparent;border:1px solid #56657e}
.mid{text-align:center}
.per{font-family:var(--label);font-size:22px;letter-spacing:.08em}
.per.fin{background:var(--warn);color:#fff;border-radius:4px;padding:2px 10px;font-size:18px}
.arrow{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--on-navy-muted);margin-top:6px;white-space:nowrap}
main{display:grid;gap:12px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
h2{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
h2 small{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap;color:var(--text)}
th:first-child,td:first-child{text-align:left}
td.nm{text-align:left;color:var(--ink);font-weight:600}
td.num{font-family:var(--display);font-size:16px;color:var(--ink);width:34px}
tr.tot td{font-weight:700;color:var(--ink);border-bottom:0;border-top:1px solid var(--line)}
td.win{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--off)}
.line td:last-child,.line th:last-child{font-weight:700;color:var(--ink)}
.cmp td:first-child{color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.flow div{background:var(--chip);border-radius:6px;padding:8px 10px}
.flow span{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.flow b{color:var(--ink);font-size:13px}
.plays{list-style:none;margin:0;padding:0}
.plays li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--hair);align-items:start}
.plays li:last-child{border-bottom:0}
.plays .q{font-size:11px;font-weight:700;color:var(--muted);padding-top:1px}
.plays .t{min-width:0;overflow-wrap:anywhere}
.plays .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--line)}
.plays li.O .t::before{background:var(--off)}
.plays li.D .t::before{background:var(--def)}
.plays .s{font-weight:700;color:var(--ink)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.charts b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.court{width:100%;height:auto;display:block;border-radius:4px}
.legend{font-size:11px;color:var(--muted);margin-top:6px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--label);font-size:22px;letter-spacing:.06em;color:var(--ink);margin-bottom:6px;text-transform:uppercase}
.err{background:#fbe6e5;color:var(--def);border-radius:6px;padding:8px 10px;font-size:12px;font-weight:600}
footer{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;letter-spacing:.06em}
.two{display:grid;gap:12px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top"><span class="brand">Firebirds Live</span><span class="status" id="status"><i></i><span id="stTxt">Connecting</span></span></div>
    <div class="board" id="board"></div>
  </div>
</header>
<div class="wrap">
  <div class="err" id="err" hidden style="margin-top:12px"></div>
  <main id="main"><div class="empty"><b>Loading</b>Getting the game feed…</div></main>
  <footer>Kettering Fairmont Athletics · updates every 15 seconds</footer>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(m,a)=>a?Math.round(100*m/a)+'%':'–';
const fp=v=>v==null?'–':Math.round(v*100)+'%';
const fd=v=>v==null?'–':Number(v).toFixed(2);
const params=new URLSearchParams(location.search); const sid=(params.get('s')||'').trim();
const FEED=/^[\w-]{20,}$/.test(sid)?'https://script.google.com/macros/s/'+sid+'/exec?type=live':(/^https:\/\/script\.google\.com\//.test(sid)?sid+(sid.includes('?')?'&':'?')+'type=live':'');
let M=null, lastOk=0, timer=null, fails=0;
const COL={us:'#1593b3',them:'#d63b35'};
function courtSVG(shots,team){
  const L='#c9cccc'; let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" class="court" role="img" aria-label="Shot chart"><rect x="1" y="1" width="498" height="338" fill="#fff" stroke="${L}" stroke-width="3"/><rect x="190" y="1" width="120" height="189" fill="#f3f4f4" stroke="${L}" stroke-width="3"/><circle cx="250" cy="190" r="60" fill="none" stroke="${L}" stroke-width="3"/><line x1="220" y1="40" x2="280" y2="40" stroke="${L}" stroke-width="4"/><circle cx="250" cy="52.5" r="7.5" fill="none" stroke="${L}" stroke-width="3"/><path d="M52.5 1 L52.5 52.5 A197.5 197.5 0 0 0 447.5 52.5 L447.5 1" fill="none" stroke="${L}" stroke-width="3"/>`;
  const c=COL[team];
  (shots||[]).forEach(s=>{ const X=s[0]*10, Y=Math.min(s[1],33.2)*10;
    g+=s[2]?`<circle cx="${X}" cy="${Y}" r="9" fill="${c}" stroke="#fff" stroke-width="2"/>`:`<path d="M${X-8} ${Y-8} L${X+8} ${Y+8} M${X+8} ${Y-8} L${X-8} ${Y+8}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`; });
  return g+'</svg>';
}
function pips(left,max){ let h=''; for(let i=0;i<max;i++)h+=`<b class="${i<left?'':'u'}"></b>`; return h; }
function ago(){ if(!M||!M.updated)return ''; const s=Math.max(0,Math.round((Date.now()-new Date(M.updated).getTime())/1000)); return s<60?s+'s ago':s<3600?Math.round(s/60)+' min ago':new Date(M.updated).toLocaleString([], {month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function setStatus(){
  const st=$('status');
  if(!M){ st.className='status'; $('stTxt').textContent=FEED?'Waiting for the game':'No game link'; return; }
  const stale=M.updated&&(Date.now()-new Date(M.updated).getTime())>20*60*1000;
  st.className='status '+(M.final?'final':stale?'':'live');
  $('stTxt').textContent=M.final?'Final':(stale?'Last update '+ago():'Live · updated '+ago());
}
function teamCol(k){
  const us=k==='us', sc=M.score[us?0:1], to=M.to[k], f=M.fouls[k], other=M.fouls[us?'them':'us'];
  return `<div class="team ${us?'us':'r'}"><div class="tname">${esc(us?M.us:M.opp)}</div><div class="score">${sc}</div>
    <div class="meta">Fouls ${f}${other>=5?' <span class="bonus">Bonus</span>':''}</div>
    <div class="pips">${us?'TO ':''}${pips(to.full,3)}&nbsp;${pips(to.s30,2)}${us?'':' TO'}</div></div>`;
}
function render(){
  setStatus();
  if(!M){ $('board').innerHTML=''; $('main').innerHTML=FEED?`<div class="empty"><b>No game yet</b>The score shows up here once the bench starts the game.</div>`:`<div class="empty"><b>Link is missing the game code</b>Ask for the full live page link.</div>`; return; }
  document.title=`${M.us} ${M.score[0]}, ${M.opp} ${M.score[1]}`+(M.final?' · Final':' · Live');
  $('board').innerHTML=teamCol('us')+`<div class="mid"><div class="per ${M.final?'fin':''}">${M.final?'FINAL':esc(M.period)}</div>${M.final?'':`<div class="arrow">${M.arrow==='us'?'◀ ARROW':'ARROW ▶'}</div>`}</div>`+teamCol('them');
  const t=M.track||{}, O=M.team.O, D=M.team.D; let h='';
  // linescore
  const n=Math.max(M.line.us.length,M.line.them.length,4); const lab=i=>i<4?'Q'+(i+1):(i===4?'OT':'OT'+(i-3));
  h+=`<section class="card"><h2>Score by quarter</h2><div class="tw"><table class="line"><tr><th></th>${Array.from({length:n},(_,i)=>`<th>${lab(i)}</th>`).join('')}<th>T</th></tr>`+
    [['us',M.us,0],['them',M.opp,1]].map(([k,nm,ix])=>`<tr><td class="nm">${esc(nm)}</td>${Array.from({length:n},(_,i)=>`<td>${M.line[k][i]!=null?M.line[k][i]:''}</td>`).join('')}<td>${M.score[ix]}</td></tr>`).join('')+`</table></div></section>`;
  // flow
  h+=`<section class="card"><h2>Game flow</h2><div class="flow"><div><span>Current run</span><b>${esc(M.flow.run)}</b></div><div><span>Largest lead</span><b>${esc(M.flow.lead)}</b></div><div><span>Lead changes</span><b>${esc(M.flow.changes)}</b></div><div><span>Longest run</span><b>${esc(M.flow.longest)}</b></div></div></section>`;
  // team stats
  const row=(l,a,b,hi)=>{ let w=0; if(hi!==undefined&&a!=null&&b!=null&&a!=='–'&&b!=='–'&&+a!==+b){ w=((+a>+b)===hi)?1:-1; } return [l,a,b,w]; };
  const rows=[
    ['FG',`${O.fgm}-${O.fga} · ${pct(O.fgm,O.fga)}`,`${D.fgm}-${D.fga} · ${pct(D.fgm,D.fga)}`,0],
    ['3PT',`${O.t3m}-${O.t3a} · ${pct(O.t3m,O.t3a)}`,`${D.t3m}-${D.t3a} · ${pct(D.t3m,D.t3a)}`,0],
    ['FT',`${O.ftm}-${O.fta} · ${pct(O.ftm,O.fta)}`,`${D.ftm}-${D.fta} · ${pct(D.ftm,D.fta)}`,0],
    row('Turnovers',O.to,D.to,false), row('Off rebounds',O.orb,D.orb,true), row('2nd chance pts',O.scp,D.scp,true), row('Pts off turnovers',O.pot,D.pot,true)];
  [['Pts in the paint','paint'],['Fast break pts','fb'],['Bench pts','bench']].forEach(([l,k])=>{ if(O[k]!=='–'||D[k]!=='–')rows.push(row(l,O[k],D[k],true)); });
  rows.push(row('Possessions',O.poss,D.poss));
  rows.push(['Pts per possession',O.poss?(O.pts/O.poss).toFixed(2):'–',D.poss?(D.pts/D.poss).toFixed(2):'–',0]);
  const ffr=[['Effective FG %','efg',fp,true],['Turnover %','tov',fp,false],['Off rebound %','orbp',fp,true],['FT rate','ftr',fd,true]].map(([l,k,f,hi])=>{const a=O[k],b=D[k]; const w=a==null||b==null||a===b?0:((a>b)===hi?1:-1); return [l,f(a),f(b),w];});
  const tbl=(title,rs)=>`<section class="card"><h2>${title}</h2><div class="tw"><table class="cmp"><tr><th></th><th>${esc(M.us).slice(0,12)}</th><th>${esc(M.opp).slice(0,12)}</th></tr>`+rs.map(r=>`<tr><td>${r[0]}</td><td class="${r[3]>0?'win':''}">${r[1]}</td><td class="${r[3]<0?'win':''}">${r[2]}</td></tr>`).join('')+`</table></div></section>`;
  h+=`<div class="two">${tbl('Team stats',rows)}${tbl('Four Factors',ffr)}</div>`;
  // box scores
  const boxT=(title,list,tk)=>{
    const c=[]; if(tk.pts)c.push(['PTS',p=>p.pts]); if(tk.pts||tk.miss){c.push(['FG',p=>p.fgm+'-'+p.fga]);c.push(['3PT',p=>p.t3m+'-'+p.t3a]);} if(tk.pts)c.push(['FT',p=>p.ftm+'-'+p.fta]);
    if(tk.reb)c.push(['REB',p=>p.reb]); if(tk.ast)c.push(['AST',p=>p.ast]); if(tk.stl)c.push(['STL',p=>p.stl]); if(tk.blk)c.push(['BLK',p=>p.blk]); if(tk.to)c.push(['TO',p=>p.to]); c.push(['PF',p=>p.pf]);
    if(!list.length)return '';
    const tot={}; ['pts','fgm','fga','t3m','t3a','ftm','fta','reb','ast','stl','blk','to','pf'].forEach(k=>tot[k]=list.reduce((a,p)=>a+(+p[k]||0),0));
    return `<section class="card"><h2>${esc(title)} <small>${tk.pts?'':'Fouls only'}</small></h2><div class="tw"><table><tr><th>#</th><th style="text-align:left">Player</th>${c.map(x=>`<th>${x[0]}</th>`).join('')}</tr>`+
      list.map(p=>`<tr><td class="num">${esc(p.n)}</td><td class="nm">${esc(p.name)}${p.gs?' <small style="color:var(--muted);font-weight:500">S</small>':''}</td>${c.map(x=>`<td>${x[1](p)}</td>`).join('')}</tr>`).join('')+
      (tk.pts?`<tr class="tot"><td></td><td style="text-align:left">Players</td>${c.map(x=>`<td>${x[1](tot)}</td>`).join('')}</tr>`:'')+`</table></div></section>`;
  };
  h+=boxT(M.us+' box score',M.players||[],t);
  if(t.opp&&(M.oppPlayers||[]).length)h+=boxT(M.opp+' box score',M.oppPlayers,t);
  // plays
  if((M.plays||[]).length)h+=`<section class="card"><h2>Latest plays <small>Newest first</small></h2><ul class="plays">${M.plays.map(p=>`<li class="${p.o||''}"><span class="q">${esc(p.q)}</span><span class="t">${esc(p.txt)}</span><span class="s">${esc(p.sc)}</span></li>`).join('')}</ul></section>`;
  // charts
  const su=(M.shots&&M.shots.us)||[], st=(M.shots&&M.shots.them)||[];
  if(su.length||st.length){
    const sub=a=>`${a.filter(s=>s[2]).length}/${a.length} charted`;
    h+=`<section class="card"><h2>Shot charts <small>Filled = make, ✕ = miss</small></h2><div class="charts">${su.length?`<div><b>${esc(M.us)} · ${sub(su)}</b>${courtSVG(su,'us')}</div>`:''}${st.length?`<div><b>${esc(M.opp)} · ${sub(st)}</b>${courtSVG(st,'them')}</div>`:''}</div></section>`;
  }
  $('main').innerHTML=h;
}
async function load(){
  if(!FEED){ render(); return; }
  try{
    const r=await fetch(FEED,{cache:'no-store'}); const j=await r.json();
    if(!j.ok)throw new Error(j.error||'Feed error');
    M=j.model||null; lastOk=Date.now(); fails=0; $('err').hidden=true; render();
  }catch(e){
    fails++; if(fails>=2||!M){ $('err').hidden=false; $('err').textContent='Can\'t reach the game feed right now. Trying again.'; }
    if(!M)render();
  }
  schedule();
}
function schedule(){ clearTimeout(timer); if(document.hidden)return; timer=setTimeout(load,M&&M.final?60000:15000); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)load(); else clearTimeout(timer); });
setInterval(setStatus,5000);
load();
})();
</script>
</body>
</html>
